<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notas do Aluno - Planner Acadêmico</title>
  <link rel="stylesheet" href="style.css">
  <script src="avaliacao-utils.js" defer></script>
  <script src="notas.js" defer></script>
  <script src="sync.js" defer></script>
</head>
<body>

  <nav class="navbar">
    <div class="logo">
      <span class="titulo-site">PLANNER ACADÊMICO</span>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Início</a></li>
      <li><a href="agenda.html">Agenda</a></li>
      <li><a href="notas.html" class="nav-ativo">Notas</a></li>
      <li><a href="desempenho.html">Desempenho</a></li>
    </ul>
  </nav>

  <div class="container">
    <h1>Notas do Aluno</h1>

    <section class="form-section">
      <h3>Adicionar Disciplina</h3>
      <div class="form-row">
        <input type="text" id="nova-disciplina" placeholder="Nome da nova disciplina">
        <button type="button" class="btn-add" id="btn-add-disciplina">Adicionar Disciplina</button>
      </div>
    </section>

    <section id="disciplinas-section">
      <h3 style="margin-bottom: 12px;">Disciplinas e Avaliações</h3>
      <div id="disciplinas-container"></div>
    </section>

    <section class="form-section" id="section-faltas">
      <h3>Registrar Faltas</h3>

      <div id="faltas-lista"></div>

      <div class="form-row" style="margin-top: 16px;">
        <select id="select-disciplina-falta">
          <option value="">Selecione a Disciplina</option>
        </select>
        <input type="number" id="limite-falta" placeholder="Limite de faltas" min="1" step="1" style="max-width: 160px; flex: 0 0 160px;">
        <button type="button" class="btn-add" id="btn-definir-limite">Definir Limite</button>
      </div>
    </section>
  </div>

  <footer>
    <p>&copy; 2026 Coelho, Plakhotnikov, Trindade, Versiani. Todos os direitos reservados.</p>
  </footer>

</body>
</html>
