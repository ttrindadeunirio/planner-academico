<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda - Planner Acadêmico</title>
</head>

<body>
  <nav class="navbar">
    <div class="logo">
      <span class="titulo-site">PLANNER ACADÊMICO</span>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Início</a></li>
      <li><a href="agenda.html" class="nav-ativo">Agenda</a></li>
      <li><a href="notas.html">Notas</a></li>
      <li><a href="desempenho.html">Desempenho</a></li>
    </ul>
  </nav>

  <div class="container">
    <h1>Agenda</h1>

    <section class="agenda-layout">
      <div class="calendario-wrapper">
        <div class="calendario-header">
          <button class="btn-nav anterior">&lt;</button>
          <span class="mes-ano"><span id="mes"></span> <span id="ano"></span></span>
          <button class="btn-nav proximo">&gt;</button>
        </div>

        <div class="semana">
          <div>Dom</div>
          <div>Seg</div>
          <div>Ter</div>
          <div>Qua</div>
          <div>Qui</div>
          <div>Sex</div>
          <div>Sáb</div>
        </div>

        <div class="dias"></div>
      </div>

      <div class="painel-evento">
        <h3 id="eventoTitulo">Novo Evento</h3>

        <label for="inputTitulo">Título</label>
        <input type="text" id="inputTitulo" placeholder="Ex: Trabalho de PI">

        <label for="inputData">Data</label>
        <input type="date" id="inputData">

        <label for="inputHora">Hora</label>
        <input type="time" id="inputHora">

        <label for="inputCategoria">Categoria</label>
        <select id="inputCategoria"></select>

        <div class="painel-botoes">
          <button id="btnExcluir" class="btn-excluir" style="display:none;">Excluir</button>
          <button id="btnCancelar" class="btn-cancelar">Cancelar</button>
          <button id="btnSalvar" class="btn-salvar">Salvar</button>
        </div>

        <div id="eventos-hoje" class="eventos-hoje-wrapper" style="display:none;">
          <h4 class="eventos-hoje-titulo">Eventos do dia</h4>
          <div id="lista-eventos-hoje"></div>
        </div>
      </div>
    </section>

    <section class="lista-eventos-section">
      <div class="lista-eventos-header">
        <h3>Eventos Registrados</h3>
        <select id="filtroCategoria"></select>
      </div>
      <div id="lista-todos-eventos" class="lista-todos-eventos"></div>
    </section>
  </div>

<script src="agenda.js"></script>
<script src="sync.js"></script>

  <footer>
    <p>&copy; 2026 Coelho, Plakhotnikov, Trindade, Versiani. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
